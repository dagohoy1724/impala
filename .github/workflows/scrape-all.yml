name: Daily Render Scrape All

on:
  schedule:
    # Primary: 09:07 AM Philippine Time (Asia/Manila, UTC+8)
    - cron: '7 1 * * *'
    # Backup 1: 09:23 AM PHT (runs only if primary cron was dropped or failed)
    - cron: '23 1 * * *'
    # Backup 2: 09:41 AM PHT (runs only if earlier slots were dropped or failed)
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: Optional comma-separated YYYY-MM-DD dates (empty scrapes all active dates)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: scrape-all
  cancel-in-progress: false

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trigger and verify Render scrape-all
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SCRAPE_DATES: ${{ inputs.dates || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: scrape-all.yml
        run: python3 -u scripts/trigger_scrape.py
