name: Daily Render Scrape All

on:
  schedule:
    # 18:07 UTC (02:07 AM PHT): scheduled ahead of GitHub's 00:00-02:00 UTC cron backlog
    # (~7h queue lag) so the daily scrape completes by ~09:00 AM PHT
    - cron: '7 18 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: Optional comma-separated YYYY-MM-DD dates (empty scrapes all active dates)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: scrape-all
  cancel-in-progress: false

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trigger and verify Render scrape-all
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SCRAPE_DATES: ${{ inputs.dates || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: scrape-all.yml
        run: python3 -u scripts/trigger_scrape.py
